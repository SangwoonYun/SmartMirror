<div id='today-module' class='today' style='{{ style }}'>
    <span id='today-date'></span>
</div>
<script src='/modules/common/datetime_formatter.js'></script>
<script>
    (function() {
        'use strict';

        const DATE_FORMAT = '{{ date_format }}';
        const REFRESH_INTERVAL = {{ refresh_interval }};

        /**
         * 날짜 업데이트
         */
        function updateToday() {
            const element = document.getElementById('today-date');

            // 요소가 없으면 종료
            if (!element) {
                console.warn('[Today] Element not found');
                return;
            }

            const now = new Date();
            element.innerText = formatDateTime(DATE_FORMAT, now);
        }

        // 페이지 로드 즉시 실행
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', updateToday);
        } else {
            updateToday();
        }

        // 주기적으로 실행
        setInterval(updateToday, REFRESH_INTERVAL);

        console.log(`[Today] Initialized (format: ${DATE_FORMAT}, interval: ${REFRESH_INTERVAL}ms)`);
    })();
</script>
