<div id='clock-module' class='clock' style='{{ style }}'>
    <span id='clock-time'></span>
</div>
<script src='/modules/common/datetime_formatter.js'></script>
<script>
    (function() {
        'use strict';

        const TIME_FORMAT = '{{ time_format }}';
        const REFRESH_INTERVAL = {{ refresh_interval }};

        /**
         * 시계 시간 업데이트
         */
        function updateClock() {
            const element = document.getElementById('clock-time');

            // 요소가 없으면 종료
            if (!element) {
                console.warn('[Clock] Element not found');
                return;
            }

            const now = new Date();
            element.innerText = formatDateTime(TIME_FORMAT, now);
        }

        // 페이지 로드 즉시 실행
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', updateClock);
        } else {
            updateClock();
        }

        // 주기적으로 실행
        setInterval(updateClock, REFRESH_INTERVAL);

        console.log(`[Clock] Initialized (format: ${TIME_FORMAT}, interval: ${REFRESH_INTERVAL}ms)`);
    })();
</script>
