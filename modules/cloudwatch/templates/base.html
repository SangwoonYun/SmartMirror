<div id='cloudwatch-module' class='cloudwatch-dashboard' style='{{ style }}'>
    <h2 style='margin-bottom: 20px; font-size: 32px; text-align: center;'>{{ title }}</h2>

    <div id='cloudwatch-loading' style='text-align: center; padding: 40px;'>
        <p style='font-size: 20px; color: #888;'>CloudWatch 데이터 로딩 중...</p>
    </div>

    <div id='cloudwatch-error' style='display: none; text-align: center; padding: 20px;'>
        <p style='color: #ff6b6b; font-size: 18px;'>⚠️ CloudWatch 데이터를 불러올 수 없습니다.</p>
        <p id='error-message' style='color: #888; font-size: 14px; margin-top: 10px;'></p>
    </div>

    <!-- CloudWatch 24-column 그리드 시스템 -->
    <div id='cloudwatch-widgets' style='position: relative; width: 100%;'>
        <!-- 위젯들이 절대 위치로 배치됩니다 -->
    </div>
</div>

<!-- Chart.js CDN -->
<script src='https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js'></script>
<script src='https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js'></script>

<script>
    // 전역 변수
    var refreshInterval = {{ refresh_interval }};
    var charts = {}; // Chart.js 인스턴스를 저장

    // CloudWatch 그리드 설정 (24-column 시스템)
    var GRID_COLUMNS = 24;
    var COLUMN_WIDTH = 100 / GRID_COLUMNS; // %
    var ROW_HEIGHT = 30; // px (CloudWatch 기본값)

    // CloudWatch 데이터 가져오기
    function fetchCloudWatchData() {
        fetch('/api/cloudwatch-data')
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    showError(data.error);
                } else {
                    renderWidgets(data.widgets);
                }
            })
            .catch(error => {
                console.error('Error fetching CloudWatch data:', error);
                showError('네트워크 오류: ' + error.message);
            });
    }

    // 에러 표시
    function showError(message) {
        document.getElementById('cloudwatch-loading').style.display = 'none';
        document.getElementById('cloudwatch-error').style.display = 'block';
        document.getElementById('error-message').innerText = message;
    }

    // 위젯 렌더링
    function renderWidgets(widgets) {
        document.getElementById('cloudwatch-loading').style.display = 'none';
        document.getElementById('cloudwatch-error').style.display = 'none';

        var widgetsContainer = document.getElementById('cloudwatch-widgets');

        // 최대 높이 계산 (모든 위젯을 포함할 수 있도록)
        var maxHeight = 0;
        widgets.forEach(function(widget) {
            var widgetBottom = (widget.y + widget.height) * ROW_HEIGHT;
            if (widgetBottom > maxHeight) {
                maxHeight = widgetBottom;
            }
        });
        widgetsContainer.style.height = maxHeight + 'px';

        // 기존 위젯 제거하지 않고 업데이트
        if (widgetsContainer.children.length === 0) {
            // 최초 렌더링 - 위젯을 y 좌표 순으로 정렬
            var sortedWidgets = widgets.slice().sort(function(a, b) {
                if (a.y !== b.y) return a.y - b.y;
                return a.x - b.x;
            });

            sortedWidgets.forEach(function(widget, index) {
                createWidget(widget, index);
            });
        } else {
            // 기존 차트 업데이트
            widgets.forEach(function(widget, index) {
                updateWidget(widget, index);
            });
        }
    }

    // 위젯 생성
    function createWidget(widget, index) {
        var widgetsContainer = document.getElementById('cloudwatch-widgets');
        var widgetDiv = document.createElement('div');
        widgetDiv.id = 'widget-' + index;
        widgetDiv.className = 'cloudwatch-widget';

        // CloudWatch 그리드 좌표를 CSS 위치로 변환
        var left = widget.x * COLUMN_WIDTH; // %
        var top = widget.y * ROW_HEIGHT; // px
        var width = widget.width * COLUMN_WIDTH; // %
        var height = widget.height * ROW_HEIGHT; // px

        widgetDiv.style.cssText =
            'position: absolute;' +
            'left: ' + left + '%;' +
            'top: ' + top + 'px;' +
            'width: ' + width + '%;' +
            'height: ' + height + 'px;' +
            'background-color: #1a1a1a;' +
            'border: 2px solid #444;' +
            'border-radius: 8px;' +
            'padding: 15px;' +
            'box-sizing: border-box;';

        var title = document.createElement('h3');
        title.style.cssText = 'margin: 0 0 10px 0; font-size: 16px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;';
        title.innerText = widget.title;
        widgetDiv.appendChild(title);

        if (widget.type === 'metric' && widget.data && widget.data.length > 0) {
            var canvasContainer = document.createElement('div');
            canvasContainer.style.cssText = 'height: calc(100% - 30px); position: relative;';

            var canvas = document.createElement('canvas');
            canvas.id = 'chart-' + index;
            canvasContainer.appendChild(canvas);
            widgetDiv.appendChild(canvasContainer);

            widgetsContainer.appendChild(widgetDiv);

            // Chart.js로 차트 생성 (yAxis, annotations 설정 전달)
            createChart(canvas, widget.data, index, widget.yAxis, widget.annotations);
        } else {
            var noData = document.createElement('p');
            noData.style.cssText = 'color: #888; text-align: center; padding: 20px; margin: 0;';
            noData.innerText = '데이터가 없습니다.';
            widgetDiv.appendChild(noData);
            widgetsContainer.appendChild(widgetDiv);
        }
    }

    // 위젯 업데이트
    function updateWidget(widget, index) {
        if (widget.type === 'metric' && widget.data && widget.data.length > 0) {
            updateChart(widget.data, index);
        }
    }

    // Chart.js 차트 생성
    function createChart(canvas, metricDataList, index, yAxisConfig, annotationsConfig) {
        var ctx = canvas.getContext('2d');

        // 데이터셋 생성 (여러 메트릭이 있을 수 있음)
        var datasets = metricDataList.map(function(metricData, idx) {
            // JSON에서 색상이 정의되어 있으면 사용, 없으면 기본 팔레트 사용
            var color = metricData.color || getColor(idx);

            // label이 정의되어 있으면 사용, 없으면 기본 포맷 사용
            var displayLabel = metricData.label || (metricData.metric_name + ' (' + metricData.stat + ')');

            return {
                label: displayLabel,
                data: metricData.timestamps.map(function(timestamp, i) {
                    return {
                        x: new Date(timestamp),
                        y: metricData.values[i]
                    };
                }),
                borderColor: color,
                backgroundColor: 'transparent',
                borderWidth: 2,
                tension: 0.1,
                fill: false,
                pointRadius: 0,
                pointHoverRadius: 4,
                pointBackgroundColor: color,
                pointBorderColor: color,
                pointHoverBorderWidth: 2
            };
        });

        // 가로 주석선 추가 (annotations.horizontal)
        if (annotationsConfig && annotationsConfig.horizontal && annotationsConfig.horizontal.length > 0) {
            // 시간 범위 계산 (모든 메트릭의 타임스탬프 범위)
            var allTimestamps = [];
            metricDataList.forEach(function(metricData) {
                allTimestamps = allTimestamps.concat(metricData.timestamps);
            });

            if (allTimestamps.length > 0) {
                var minTime = new Date(Math.min.apply(null, allTimestamps.map(function(t) { return new Date(t).getTime(); })));
                var maxTime = new Date(Math.max.apply(null, allTimestamps.map(function(t) { return new Date(t).getTime(); })));

                // 각 가로선을 데이터셋으로 추가
                annotationsConfig.horizontal.forEach(function(annotation) {
                    datasets.push({
                        label: annotation.label || 'Threshold',
                        data: [
                            { x: minTime, y: annotation.value },
                            { x: maxTime, y: annotation.value }
                        ],
                        borderColor: annotation.color || '#ff6b6b',
                        backgroundColor: 'transparent',
                        borderWidth: 1,
                        borderDash: [5, 5],
                        fill: false,
                        pointRadius: 0,
                        pointHoverRadius: 0,
                        showLine: true,
                        // 레이블에 표시하지 않도록 설정 (나중에 legend에서 필터링)
                        hidden: false,
                        skipLegend: true  // 커스텀 속성
                    });
                });
            }
        }

        var chart = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: datasets
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    intersect: false,
                    mode: 'index'
                },
                plugins: {
                    legend: {
                        display: true,
                        position: 'bottom',
                        labels: {
                            color: '#fff',
                            font: {
                                size: 10
                            },
                            boxWidth: 12,
                            padding: 5,
                            filter: function(legendItem, chartData) {
                                // skipLegend가 true인 데이터셋은 레전드에서 제외
                                var dataset = chartData.datasets[legendItem.datasetIndex];
                                return !dataset.skipLegend;
                            }
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(0, 0, 0, 0.8)',
                        titleColor: '#fff',
                        bodyColor: '#fff',
                        titleFont: {
                            size: 11
                        },
                        bodyFont: {
                            size: 10
                        }
                    }
                },
                scales: {
                    x: {
                        type: 'time',
                        time: {
                            displayFormats: {
                                minute: 'HH:mm',
                                hour: 'HH:mm'
                            }
                        },
                        ticks: {
                            color: '#888',
                            font: {
                                size: 9
                            },
                            maxRotation: 0,
                            autoSkipPadding: 10
                        },
                        grid: {
                            color: '#333'
                        }
                    },
                    y: {
                        min: yAxisConfig && yAxisConfig.left && yAxisConfig.left.min !== undefined ? yAxisConfig.left.min : undefined,
                        max: yAxisConfig && yAxisConfig.left && yAxisConfig.left.max !== undefined ? yAxisConfig.left.max : undefined,
                        ticks: {
                            color: '#888',
                            font: {
                                size: 9
                            }
                        },
                        grid: {
                            color: '#333'
                        }
                    }
                }
            }
        });

        // 차트 인스턴스 저장
        charts['chart-' + index] = chart;
    }

    // Chart.js 차트 업데이트
    function updateChart(metricDataList, index) {
        var chartKey = 'chart-' + index;
        var chart = charts[chartKey];

        if (!chart) return;

        // 데이터셋 업데이트
        chart.data.datasets = metricDataList.map(function(metricData, idx) {
            // JSON에서 색상이 정의되어 있으면 사용, 없으면 기본 팔레트 사용
            var color = metricData.color || getColor(idx);

            // label이 정의되어 있으면 사용, 없으면 기본 포맷 사용
            var displayLabel = metricData.label || (metricData.metric_name + ' (' + metricData.stat + ')');

            return {
                label: displayLabel,
                data: metricData.timestamps.map(function(timestamp, i) {
                    return {
                        x: new Date(timestamp),
                        y: metricData.values[i]
                    };
                }),
                borderColor: color,
                backgroundColor: 'transparent',
                borderWidth: 2,
                tension: 0.1,
                fill: false,
                pointRadius: 0,
                pointHoverRadius: 4,
                pointBackgroundColor: color,
                pointBorderColor: color,
                pointHoverBorderWidth: 2
            };
        });

        chart.update();
    }

    // 색상 팔레트
    function getColor(index) {
        var colors = [
            '#3498db', // 파랑
            '#2ecc71', // 초록
            '#e74c3c', // 빨강
            '#f39c12', // 주황
            '#9b59b6', // 보라
            '#1abc9c', // 청록
            '#e67e22', // 오렌지
            '#34495e'  // 회색
        ];
        return colors[index % colors.length];
    }

    // 초기 로드
    fetchCloudWatchData();

    // 주기적으로 데이터 새로고침
    if (refreshInterval > 0) {
        setInterval(fetchCloudWatchData, refreshInterval);
    }
</script>

<style>
    #cloudwatch-module {
        color: white;
        padding: 20px;
    }

    #cloudwatch-widgets {
        margin-top: 20px;
        min-height: 400px;
    }

    .cloudwatch-widget {
        overflow: hidden;
    }

    /* 스크롤 가능하도록 설정 */
    #cloudwatch-module {
        max-height: 90vh;
        overflow-y: auto;
    }

    /* 스크롤바 스타일 (dark theme) */
    #cloudwatch-module::-webkit-scrollbar {
        width: 8px;
    }

    #cloudwatch-module::-webkit-scrollbar-track {
        background: #1a1a1a;
    }

    #cloudwatch-module::-webkit-scrollbar-thumb {
        background: #444;
        border-radius: 4px;
    }

    #cloudwatch-module::-webkit-scrollbar-thumb:hover {
        background: #666;
    }
</style>
